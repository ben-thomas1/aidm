[project]
name = "aidm"
version = "0.1.0"
description = "AI Dungeon Master world simulation engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "pydantic-ai-slim[mcp,openai,anthropic]",
    "anthropic[vertex]",
    "mcp",
    "rich",
    "prompt-toolkit>=3.0.52",
]

[project.scripts]
aidm = "aidm.frontends.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/games", "/examples", "/README.md", "/pyproject.toml",
    "/uv.lock", "/.python-version", "/ruff.toml", "/ty.toml", "/.gitignore",
    "/.github",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.35",
    "pytest>=8",
    "pyinstrument>=5.1.2",
]
