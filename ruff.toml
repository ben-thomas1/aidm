# ============================================================================
# Ruff Configuration - Comprehensive Example
# Ruff is an extremely fast Python linter and formatter written in Rust
# Docs: https://docs.astral.sh/ruff/
# ============================================================================

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------

# Project source directories for import detection
src = ["src"]

# Target Python version for syntax compatibility
target-version = "py314"

# Line length for formatting and line-length-based rules
line-length = 100

# Indentation style (spaces or tabs)
indent-width = 4

# Exclude patterns (gitignore-style globs)
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Files to include (overrides exclude)
# extend-include = ["*.pyi"]

# Additional exclusions
# extend-exclude = ["*.ipynb"]

# Respect gitignore files
respect-gitignore = true

# Force exclude even when passing files explicitly
force-exclude = true

# ----------------------------------------------------------------------------
# Linting Configuration
# ----------------------------------------------------------------------------

[lint]
# Enable preview mode for experimental rules
preview = false

# Rule selection - extensive list showing major rule categories
select = [
    # Pyflakes (F) - Basic Python errors
    "F",

    # pycodestyle (E, W) - PEP 8 style conventions
    "E",
    "W",

    # mccabe (C90) - Complexity checking
    "C90",

    # isort (I) - Import sorting
    "I",

    # pep8-naming (N) - PEP 8 naming conventions
    "N",

    # pydocstyle (D) - Docstring conventions
    "D",

    # pyupgrade (UP) - Upgrade syntax for newer Python versions
    "UP",

    # flake8-2020 (YTT) - Misuse of sys.version or sys.version_info
    "YTT",

    # flake8-annotations (ANN) - Type annotation presence
    "ANN",

    # flake8-async (ASYNC) - Async/await best practices
    "ASYNC",

    # flake8-bandit (S) - Security issues
    "S",

    # flake8-blind-except (BLE) - Blind exception catching
    "BLE",

    # flake8-boolean-trap (FBT) - Boolean trap anti-pattern
    "FBT",

    # flake8-bugbear (B) - Common bugs and design problems
    "B",

    # flake8-builtins (A) - Shadowing of Python builtins
    "A",

    # flake8-commas (COM) - Trailing comma issues
    "COM",

    # flake8-comprehensions (C4) - Comprehension improvements
    "C4",

    # flake8-datetimez (DTZ) - Datetime without timezone info
    "DTZ",

    # flake8-debugger (T10) - Debugger imports and breakpoints
    "T10",

    # flake8-django (DJ) - Django-specific issues
    # "DJ",

    # flake8-errmsg (EM) - Error message string literals
    "EM",

    # flake8-executable (EXE) - Executable file issues
    "EXE",

    # flake8-future-annotations (FA) - Missing __future__ annotations
    "FA",

    # flake8-implicit-str-concat (ISC) - Implicit string concatenation
    "ISC",

    # flake8-import-conventions (ICN) - Import naming conventions
    "ICN",

    # flake8-logging (LOG) - Logging best practices
    "LOG",

    # flake8-logging-format (G) - Logging statement problems
    "G",

    # flake8-no-pep420 (INP) - Missing __init__.py
    "INP",

    # flake8-pie (PIE) - Miscellaneous lints
    "PIE",

    # flake8-print (T20) - Print statement usage
    "T20",

    # flake8-pyi (PYI) - Type stub file best practices
    "PYI",

    # flake8-pytest-style (PT) - Pytest-specific style
    "PT",

    # flake8-quotes (Q) - Quote style consistency
    "Q",

    # flake8-raise (RSE) - Raise statement improvements
    "RSE",

    # flake8-return (RET) - Return statement improvements
    "RET",

    # flake8-self (SLF) - Private member access
    "SLF",

    # flake8-simplify (SIM) - Code simplification suggestions
    "SIM",

    # flake8-slots (SLOT) - __slots__ usage
    "SLOT",

    # flake8-tidy-imports (TID) - Tidy imports
    "TID",

    # flake8-type-checking (TCH) - Type-checking imports
    "TCH",

    # flake8-use-pathlib (PTH) - Use pathlib instead of os.path
    "PTH",

    # flake8-gettext (INT) - f-strings in gettext calls
    "INT",

    # eradicate (ERA) - Commented-out code
    "ERA",

    # pandas-vet (PD) - Pandas-specific issues
    "PD",

    # pygrep-hooks (PGH) - Misc regex-based rules
    "PGH",

    # Pylint (PL) - Comprehensive linting
    "PL",

    # tryceratops (TRY) - Exception handling anti-patterns
    "TRY",

    # flynt (FLY) - f-string conversion opportunities
    "FLY",

    # NumPy-specific (NPY) - NumPy best practices
    "NPY",

    # Airflow (AIR) - Airflow-specific issues
    # "AIR",

    # Perflint (PERF) - Performance anti-patterns
    "PERF",

    # refurb (FURB) - Modern Python idioms
    "FURB",

    # Ruff-specific rules (RUF) - Ruff-specific checks
    "RUF",
]

# Rules to ignore (with explanations)
ignore = [
    # Line length handled by formatter
    "E501",

    # Allow lambda assignments (sometimes clearer)
    "E731",

    # Conflicts with the formatter
    "COM812",  # Trailing comma missing (enforced by the formatter)

    # pydocstyle - Allow missing docstrings in certain places
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__

    # pydocstyle - Docstring formatting flexibility
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary on second line (conflicts with D212)
    "D400",  # First line should end with a period
    "D401",  # First line should be in imperative mood
    "D415",  # First line should end with punctuation

    # Annotations - Too strict for some projects
    "ANN401",  # Dynamically typed expressions (Any) disallowed

    # Boolean trap - Sometimes necessary for API compatibility
    # "FBT001",
    # "FBT002",

    # Security - Allow hardcoded passwords in test files (see per-file-ignores)
    # "S105",
    # "S106",

    # Try/except - Allow bare except in some cases
    # "TRY003",
    # "TRY400",

    # Pylint - Adjust as needed
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison

    # Print statements - Allow in scripts
    # "T201",
]

# Specific rules to enable in unfixable
unfixable = [
    # Don't auto-remove unused imports (might be needed)
    # "F401",

    # Don't auto-remove unused variables (might be debugging)
    # "F841",

    # Don't auto-remove commented code (might be intentional)
    # "ERA001",
]

# Allow autofix behavior
fixable = ["ALL"]

# Allow unused variables prefixed with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# ----------------------------------------------------------------------------
# Rule-Specific Configuration
# ----------------------------------------------------------------------------

[lint.isort]
# Import sorting configuration
known-first-party = [
    "aidm",
]

known-third-party = []

# Import section order
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

# Combine multiple imports from same module
combine-as-imports = true

# Force wrapping of imports
# force-wrap-aliases = true
# split-on-trailing-comma = true

# Custom sections
# [lint.isort.sections]
# "custom-section" = ["custom_package"]

[lint.pydocstyle]
# Docstring convention
convention = "numpy"  # Options: google, numpy, pep257

[lint.pylint]
# Maximum number of arguments for a function
max-args = 10

# Maximum number of branches in a function
max-branches = 15

# Maximum number of return statements
max-returns = 6

# Maximum number of statements
max-statements = 60

[lint.mccabe]
# McCabe complexity threshold
max-complexity = 15

[lint.flake8-annotations]
# Allow dynamically typed expressions (Any)
allow-star-arg-any = true

# Suppress ANN401 for specific argument names
# suppress-dummy-args = true

# Don't require return type for __init__
suppress-none-returning = true

[lint.flake8-bandit]
# Security check strictness levels
check-typed-exception = true

[lint.flake8-bugbear]
# Allow extending immutable collections in comprehensions
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[lint.flake8-builtins]
# Builtin names to ignore when checking for shadowing
builtins-ignorelist = ["id", "type", "input"]

[lint.flake8-comprehensions]
# Allow dict comprehension calls
allow-dict-calls-with-keyword-arguments = true

[lint.flake8-quotes]
# Quote style
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[lint.flake8-tidy-imports]
# Ban certain imports
ban-relative-imports = "all"

# Banned modules
# [lint.flake8-tidy-imports.banned-api]
# "typing.TypedDict" = { msg = "Use typing_extensions.TypedDict instead" }

[lint.flake8-type-checking]
# Enforce type-checking imports under TYPE_CHECKING
strict = true

# Modules to always import at runtime
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase"]

# Decorators to exempt from type-checking import enforcement
runtime-evaluated-decorators = ["pydantic.validator", "pydantic.field_validator"]

[lint.flake8-pytest-style]
# Pytest fixture naming
fixture-parentheses = true

# Pytest marks
mark-parentheses = true

# Pytest parametrize names type
parametrize-names-type = "tuple"

# Pytest parametrize values type
parametrize-values-type = "tuple"

# Pytest parametrize values row type
parametrize-values-row-type = "tuple"

[lint.flake8-import-conventions]
# Standard abbreviations for imports
[lint.flake8-import-conventions.aliases]
"altair" = "alt"
"matplotlib.pyplot" = "plt"
"numpy" = "np"
"pandas" = "pd"
"seaborn" = "sns"
"tensorflow" = "tf"
"torch" = "th"
"polars" = "pl"

[lint.flake8-self]
# Ignore private member access from these methods
ignore-names = ["_get_*", "_set_*", "_validate_*"]

[lint.pyupgrade]
# Keep runtime typing behavior
keep-runtime-typing = true

[lint.pep8-naming]
# Class attribute naming style for constants
classmethod-decorators = ["classmethod", "pydantic.validator", "pydantic.field_validator"]

# Static method decorators
staticmethod-decorators = ["staticmethod"]

# Ignore specific naming rules
ignore-names = []

# Extend allowed names
extend-ignore-names = []

# ----------------------------------------------------------------------------
# Per-File Ignores
# ----------------------------------------------------------------------------

[lint.per-file-ignores]
# Test files - relax many rules
"tests/**" = [
    "D",         # No docstrings required
    "S101",      # Allow assert statements
    "S105",      # Hardcoded passwords OK in tests
    "S106",      # Hardcoded passwords OK in tests
    "ANN",       # No type annotations required
    "PLR2004",   # Magic values OK in tests
    "FBT",       # Boolean traps OK in tests
    "PT",        # Pytest style less strict
    "ARG",       # Unused arguments OK (fixtures)
    "T20",       # Print statements OK
]

# Init files - relax docstrings and unused imports
"__init__.py" = [
    "D104",      # Missing docstring in public package
    "F401",      # Unused imports OK (re-exports)
    "F403",      # Star imports OK for __init__
]

# Scripts and CLI - allow print statements
"scripts/**" = ["T20"]
"**/cli.py" = ["T20"]
"**/cli/**" = ["T20"]

# Configuration files - allow variable naming
"**/config.py" = ["N805", "N815"]
"**/settings.py" = ["N805", "N815"]

# Migration files - relax many rules
"**/migrations/**" = ["D", "ANN", "N", "E501"]

# Examples and documentation
"examples/**" = ["D", "T20", "INP001"]
"docs/**" = ["D", "INP001"]

# Type stubs
"*.pyi" = [
    "D",         # No docstrings in stubs
    "E501",      # Long lines OK
    "PYI021",    # Docstrings in stubs
]

# Notebooks (if processing .py exports)
"*.ipynb" = ["T20", "D", "E402", "I001"]

# ----------------------------------------------------------------------------
# Formatter Configuration
# ----------------------------------------------------------------------------

[format]
# Preview mode for experimental formatting
preview = false

# Quote style
quote-style = "double"

# Indentation style
indent-style = "space"

# Skip magic trailing comma
skip-magic-trailing-comma = false

# Line endings (auto-detect by default)
line-ending = "auto"

# Docstring formatting
docstring-code-format = true

# Docstring code line length
docstring-code-line-length = 80

# Exclude files from formatting
exclude = ["*.pyi"]
